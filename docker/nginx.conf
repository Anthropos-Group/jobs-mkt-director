server {
    listen 80;
    server_name _;

    root /srv/contenido;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras comunes (anti-indexación, sin referrer). Se incluyen en cada
    # location porque add_header no se hereda si la location define otro.
    include /etc/nginx/snippets/headers.conf;

    # robots.txt: bloquea a todos los rastreadores.
    location = /robots.txt {
        include /etc/nginx/snippets/headers.conf;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Explorador de carpetas (protegido con contraseña si EXPLORER_PASSWORD está definida).
    location = / {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/auth.conf;
        add_header Cache-Control "no-cache";
        root /srv/explorador;
        try_files /index.html =404;
    }

    location = /__manifest.json {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/auth.conf;
        add_header Cache-Control "no-store";
        root /srv/explorador;
        try_files /manifest.json =404;
    }

    # Compatibilidad: enlaces antiguos de la oferta de Director de Marketing.
    location = /index.html {
        return 301 /historico/2026-09-buscamos-director-marketing;
    }

    # Documentos: públicos por enlace directo. Admite URLs sin ".html".
    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|pdf)$ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Nada de archivos ocultos (.gitkeep, etc.).
    location ~ /\. {
        return 404;
    }

    error_page 404 /__404.html;
    location = /__404.html {
        internal;
        include /etc/nginx/snippets/headers.conf;
        root /srv/explorador;
        try_files /404.html =404;
    }
}
