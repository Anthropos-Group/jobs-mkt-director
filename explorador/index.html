<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Strattos — Biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #151312; --panel: #1E1B1A; --line: #2E2A28; --ink: #F6F3EF;
    --muted: #A39D98; --red: #F92828; --caramel: #FFC47E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Poppins, system-ui, sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { font: 44px/1 "Bebas Neue", sans-serif; letter-spacing: .02em; margin: 0; }
  h1 span { color: var(--red); }
  .meta { color: var(--muted); font-size: 13px; }
  .search { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; outline: none; }
  .search:focus { border-color: var(--red); }
  nav.crumbs { margin: 20px 0 12px; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
  nav.crumbs a { color: var(--ink); text-decoration: none; }
  nav.crumbs a:hover { color: var(--red); }
  ul.list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
  ul.list li { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-top: 1px solid var(--line); }
  ul.list li:first-child { border-top: 0; }
  ul.list li:hover { background: #24201F; }
  .ico { flex: none; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: 16px; }
  .ico.folder { background: rgba(255,196,126,.12); color: var(--caramel); }
  .ico.doc { background: rgba(249,40,40,.12); color: var(--red); }
  .main { flex: 1; min-width: 0; }
  .main a { color: var(--ink); text-decoration: none; font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .main a:hover { color: var(--red); }
  .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: flex; gap: 8px; flex: none; }
  button.btn { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 6px 10px; font: 500 12px Poppins, sans-serif; cursor: pointer; }
  button.btn:hover { border-color: var(--red); color: var(--red); }
  button.btn.ok { border-color: #3BB273; color: #3BB273; }
  .empty { padding: 32px 16px; text-align: center; color: var(--muted); }
  @media (max-width: 560px) { .actions .open { display: none; } h1 { font-size: 36px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Strattos <span>/</span> Biblioteca</h1>
    <div class="meta" id="meta"></div>
  </header>
  <input class="search" id="q" type="search" placeholder="Buscar propuestas, clientes, dashboards…" autocomplete="off">
  <nav class="crumbs" id="crumbs"></nav>
  <ul class="list" id="list"><li class="empty">Cargando…</li></ul>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let docs = [];

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pretty = (s) => s.replace(/\.html$/, "").replace(/[-_]+/g, " ").replace(/^\w/, (c) => c.toUpperCase());
  const cleanUrl = (p) => "/" + p.replace(/(^|\/)index\.html$/, "$1").replace(/\.html$/, "");
  const absUrl = (p) => location.origin + cleanUrl(p).split("/").map(encodeURIComponent).join("/");
  const kb = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " KB";
  const currentDir = () => decodeURIComponent(location.hash.replace(/^#\/?/, "")).replace(/\/+$/, "");

  function docRow(d, showPath) {
    const url = absUrl(d.path);
    return `<li>
      <div class="ico doc">▤</div>
      <div class="main">
        <a href="${esc(url)}" target="_blank" rel="noopener">${esc(d.title || pretty(d.path.split("/").pop()))}</a>
        <div class="sub">${esc(showPath ? d.path : d.path.split("/").pop())} · ${kb(d.size)}</div>
      </div>
      <div class="actions">
        <button class="btn copy" data-url="${esc(url)}">Copiar enlace</button>
        <button class="btn open" data-url="${esc(url)}">Abrir</button>
      </div>
    </li>`;
  }

  function render() {
    const q = $("q").value.trim().toLowerCase();
    const dir = currentDir();
    let html = "";

    if (q) {
      $("crumbs").innerHTML = `<span>Resultados para “${esc(q)}”</span>`;
      const hits = docs.filter((d) => (d.path + " " + d.title).toLowerCase().includes(q));
      html = hits.map((d) => docRow(d, true)).join("");
    } else {
      const parts = dir ? dir.split("/") : [];
      $("crumbs").innerHTML = ['<a href="#/">Inicio</a>']
        .concat(parts.map((p, i) => `<span>/</span><a href="#/${esc(parts.slice(0, i + 1).join("/"))}">${esc(pretty(p))}</a>`))
        .join("");

      const prefix = dir ? dir + "/" : "";
      const folders = new Map();
      const files = [];
      for (const d of docs) {
        if (!d.path.startsWith(prefix)) continue;
        const rest = d.path.slice(prefix.length);
        const i = rest.indexOf("/");
        if (i === -1) files.push(d);
        else {
          const name = rest.slice(0, i);
          folders.set(name, (folders.get(name) || 0) + 1);
        }
      }
      html += [...folders.keys()].sort().map((name) => `<li>
          <div class="ico folder">▣</div>
          <div class="main">
            <a href="#/${esc(prefix + name)}">${esc(pretty(name))}</a>
            <div class="sub">${folders.get(name)} documento${folders.get(name) === 1 ? "" : "s"}</div>
          </div>
        </li>`).join("");
      html += files.map((d) => docRow(d, false)).join("");
    }
    $("list").innerHTML = html || '<li class="empty">No hay documentos aquí.</li>';
  }

  $("list").addEventListener("click", async (e) => {
    const b = e.target.closest("button.btn");
    if (!b) return;
    if (b.classList.contains("open")) return window.open(b.dataset.url, "_blank", "noopener");
    try {
      await navigator.clipboard.writeText(b.dataset.url);
      b.textContent = "¡Copiado!"; b.classList.add("ok");
    } catch { prompt("Copia el enlace:", b.dataset.url); return; }
    setTimeout(() => { b.textContent = "Copiar enlace"; b.classList.remove("ok"); }, 1500);
  });
  $("q").addEventListener("input", render);
  window.addEventListener("hashchange", () => { $("q").value = ""; render(); });

  fetch("/__manifest.json", { cache: "no-store", credentials: "same-origin" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((m) => {
      docs = m.documentos || [];
      $("meta").textContent = `${docs.length} documentos · actualizado ${new Date(m.generado).toLocaleString("es")}`;
      render();
    })
    .catch(() => { $("list").innerHTML = '<li class="empty">No se pudo cargar el índice.</li>'; });
})();
</script>
</body>
</html>
